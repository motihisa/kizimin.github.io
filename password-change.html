<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>パスワード変更 | Kizimin</title>
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/kizimin-redesign.css?v=20261029-redesign1">
</head>
<body>
<main class="container" style="max-width:520px;padding-top:72px;padding-bottom:80px">
<a class="logo" href="index.html">Kizimin</a>
<section class="card" style="padding:28px;margin-top:28px">
<h1>パスワード変更</h1>
<p class="text-muted">管理者からの指定により、続行する前に新しいパスワードを設定してください。</p>
<div class="form-group"><label class="form-label" for="new-password">新しいパスワード</label><input id="new-password" class="form-input" type="password" autocomplete="new-password" minlength="12" required></div>
<div class="form-group"><label class="form-label" for="confirm-password">新しいパスワード（確認）</label><input id="confirm-password" class="form-input" type="password" autocomplete="new-password" minlength="12" required></div>
<button id="save-password" class="write-button" type="button">パスワードを変更</button><p id="password-message" class="text-muted" role="status" aria-live="polite"></p>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/ban-screen.js?v=20261030-owner-exception1"></script>
<script>
const sb=supabase.createClient("https://bimddapbkdakspjaemsm.supabase.co","sb_publishable_JSnuaf48KMeQ4sodofBg8A_RGlhFHpf");
const password=document.getElementById("new-password"),confirmPassword=document.getElementById("confirm-password"),button=document.getElementById("save-password"),message=document.getElementById("password-message");
sb.auth.getSession().then(({data,error})=>{if(error||!data.session){location.replace("login.html?next="+encodeURIComponent("password-change.html"));return;}const forced=data.session.user?.app_metadata?.must_change_password===true;const recovery=location.hash.includes("type=recovery");if(!forced&&!recovery){location.replace("index.html");}});
button.addEventListener("click",async()=>{const value=password.value;if(value.length<12){message.textContent="パスワードは12文字以上にしてください。";return;}if(value!==confirmPassword.value){message.textContent="確認用パスワードが一致しません。";return;}button.disabled=true;message.textContent="変更しています...";try{const {error}=await sb.auth.updateUser({password:value});if(error)throw error;const {data:policy,error:policyError}=await sb.functions.invoke("secure-content",{body:{action:"complete_forced_password_change"}});if(policyError||!policy?.ok)throw new Error("PASSWORD_POLICY_CLEAR_FAILED");message.textContent="パスワードを変更しました。";location.replace("index.html");}catch(error){console.error(error);message.textContent="パスワードは変更された可能性がありますが、必須変更の解除を確認できませんでした。もう一度同じパスワードで送信してください。";button.disabled=false;}});
</script></body></html>
