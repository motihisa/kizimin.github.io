<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kizimin Admin Connect</title><link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/admin.css"><link rel="stylesheet" href="css/admin-connect.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="admin-page">
<div class="ac-loading" id="ac-loading">管理者権限を確認しています...</div>
<div class="ac-denied hidden" id="ac-denied">この機能はKizimin管理者専用です。<p><a href="admin.html">管理画面へ戻る</a></p></div>
<main class="ac-app hidden" id="ac-app">
<aside class="ac-sidebar">
  <div class="ac-brand"><a href="admin.html">← 管理画面</a><h1>Kizimin <span>Connect</span></h1><small>ADMIN WORKSPACE</small></div>
  <div class="ac-section-head">チャット <button id="ac-new-room" title="新しいチャット">＋</button></div>
  <div id="ac-rooms" class="ac-rooms">読み込み中...</div>
  <div class="ac-section-head">管理者メンバー</div>
  <div id="ac-people" class="ac-people">読み込み中...</div>
  <div class="ac-sidebar-foot"><span class="ac-online-dot"></span> 管理者専用接続</div>
</aside>
<section class="ac-main">
<header class="ac-header"><div><h2 id="ac-room-title">運営チャット</h2><p id="ac-room-subtitle">管理者間のリアルタイム連絡</p></div><div class="ac-header-actions"><label class="ac-tts"><input id="ac-tts" type="checkbox"> 読み上げ</label><button id="ac-call-audio" class="ac-btn">音声通話</button></div></header>
<div id="ac-call-panel" class="ac-call-panel hidden">
  <div><strong id="ac-call-status">通話準備中</strong><p>相手を選択して通話を開始します。通話相手側もこのページを開いている必要があります。</p></div>
  <select id="ac-call-target" aria-label="通話相手"><option value="">通話相手を選択</option></select>
  <label>音声エフェクト<select id="ac-voice-effect"><option value="normal">通常</option><option value="low">低音風</option><option value="high">高音風</option><option value="robot">ロボット風</option></select></label>
  <button id="ac-call-start" class="ac-btn ac-primary">発信</button><button id="ac-call-hangup" class="ac-btn ac-danger">通話終了</button>
<audio id="ac-remote-audio" autoplay></audio>

</div>
<div class="ac-messages" id="ac-messages"><div class="ac-empty">メッセージを読み込んでいます...</div></div>
<form id="ac-compose" class="ac-compose">
  <div id="ac-attachment-preview" class="ac-attachment-preview"></div>
  <div class="ac-compose-row"><label class="ac-attach" title="画像・ファイルを添付">＋<input id="ac-file" type="file" accept="image/jpeg,image/png,image/gif,image/webp,application/pdf" hidden></label>
  <textarea id="ac-message" rows="1" maxlength="5000" placeholder="メッセージを入力..." required></textarea>
  <button type="submit" class="ac-btn ac-primary" id="ac-send">送信</button></div>
  <small>画像・PDFは10MBまで。運営メンバーだけが閲覧できます。</small>
</form>
</section></main>
<script src="js/admin-connect.js?v=20261031-access-guard1"></script>
</body></html>
