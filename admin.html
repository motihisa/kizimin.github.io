<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kizimin 管理画面</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .admin-grid{display:grid;gap:24px}.admin-table-wrap{overflow-x:auto}
    .admin-table{width:100%;border-collapse:collapse}.admin-table th,.admin-table td{padding:12px;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:top}
    .admin-table th{font-size:.9rem;white-space:nowrap}.admin-table td{font-size:.9rem}
    .admin-badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;font-size:.8rem}
    .admin-muted{color:#6b7280}.admin-actions{display:flex;gap:8px;flex-wrap:wrap}
    .admin-alert,.admin-ok{padding:14px;border-radius:8px}.admin-alert{background:#fef2f2;color:#991b1b}.admin-ok{background:#f0fdf4;color:#166534}
    .admin-log{white-space:pre-wrap;word-break:break-word;max-width:520px}
  </style>
</head>
<body>
  <header class="header"><div class="container"><div class="header-inner">
    <a class="logo" href="index.html">Kizimin</a>
    <nav class="nav"><a href="index.html">ホーム</a><a href="account.html">アカウント</a></nav>
  </div></div></header>
  <main class="container">
    <div id="admin-loading" class="card loading">管理者権限を確認しています...</div>
    <div id="admin-forbidden" class="card hidden"><div class="admin-alert"><strong>管理画面へのアクセスが拒否されました。</strong><p id="admin-forbidden-reason"></p></div><p><a href="index.html">ホームへ戻る</a></p></div>
    <div id="admin-app" class="admin-grid hidden">
      <section class="card"><h1>管理画面</h1><p class="admin-muted">Supabase側で管理者権限を確認済みです。</p><div id="role-audit-summary"></div></section>
      <section class="card"><h2>ユーザー管理</h2><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>ユーザー</th><th>表示名</th><th>権限</th><th>登録日</th><th>操作</th></tr></thead><tbody id="users-body"></tbody></table></div></section>
      <section class="card"><h2>記事管理</h2><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>タイトル</th><th>作者</th><th>状態</th><th>作成日</th><th>操作</th></tr></thead><tbody id="articles-body"></tbody></table></div></section>
      <section class="card"><h2>コメント管理</h2><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>内容</th><th>作者</th><th>状態</th><th>作成日</th><th>操作</th></tr></thead><tbody id="comments-body"></tbody></table></div></section>
      <section class="card"><h2>通報管理</h2><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>対象</th><th>理由</th><th>状態</th><th>作成日</th><th>操作</th></tr></thead><tbody id="reports-body"></tbody></table></div></section>
    </div>
  </main>
  <script src="js/admin.js"></script>
</body>
</html>
