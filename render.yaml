services:
  - type: web
    name: kizimin-backup-service
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
