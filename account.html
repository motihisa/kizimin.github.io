<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>アカウント設定 | Kizimin</title><link rel="stylesheet" href="css/style.css">
<style>
body{background:#fafaf8;color:#171717}.account-shell{max-width:1100px;margin:auto;padding:24px 24px 80px}.account-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.account-top .logo{font-size:25px;font-weight:800;text-decoration:none;color:inherit}.back-link{color:#777;text-decoration:none;font-size:14px}.account-layout{display:grid;grid-template-columns:250px 1fr;gap:24px}.account-nav,.settings-card{background:#fff;border:1px solid #e8e8e8;border-radius:20px}.account-nav{padding:10px;height:max-content;position:sticky;top:20px}.account-nav button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:13px;border-radius:11px;font:inherit;color:#555}.account-nav button.active{background:#f6f6f3;color:#111;font-weight:700}.settings-card{padding:32px}.settings-head{display:flex;justify-content:space-between;gap:20px;padding-bottom:24px;border-bottom:1px solid #e8e8e8}.settings-head h1{font-size:30px;margin:0 0 8px}.settings-head p{margin:0;color:#777}.status-dot{background:#f3f3f0;border-radius:999px;padding:8px 12px;font-size:13px;height:max-content}.profile-preview{display:flex;align-items:center;gap:16px;padding:22px 0}.avatar{width:68px;height:68px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-size:25px;font-weight:800}.preview-name{font-size:20px;font-weight:700}.preview-user{color:#777;font-size:14px}.form-section{padding:26px 0;border-top:1px solid #e8e8e8}.form-section:first-of-type{border-top:0}.form-section h2{font-size:17px;margin:0 0 5px}.section-note{font-size:13px;color:#777;margin:0 0 18px}.field{margin-bottom:18px}.field label{display:block;font-size:14px;font-weight:700;margin-bottom:7px}.field input,.field textarea{width:100%;box-sizing:border-box;border:1px solid #ddd;border-radius:11px;padding:12px 13px;background:#fff;font:inherit;outline:none}.field input:focus,.field textarea:focus{border-color:#999;box-shadow:0 0 0 3px #f0f0ed}.field textarea{min-height:120px;resize:vertical}.field small{display:block;color:#999;font-size:12px;margin-top:6px}.email-box{background:#f6f6f3;border-radius:12px;padding:13px 14px;color:#555;font-size:14px}.save-row{display:flex;justify-content:space-between;align-items:center;gap:15px;padding-top:22px;border-top:1px solid #e8e8e8}.save-button{border:0;background:#111;color:#fff;border-radius:11px;padding:12px 20px;font:inherit;font-weight:700;cursor:pointer}.save-button:disabled{opacity:.55}.hint-card{margin-top:20px;background:#f5f5f2;border-radius:14px;padding:15px 17px;font-size:13px;color:#666}@media(max-width:760px){.account-shell{padding:18px 14px 50px}.account-layout{grid-template-columns:1fr}.account-nav{position:static;display:flex;overflow:auto}.account-nav button{white-space:nowrap}.settings-card{padding:22px}.settings-head h1{font-size:25px}.status-dot{display:none}}
</style>
</head>
<body>
<main class="account-shell">
<header class="account-top"><a class="logo" href="index.html">Kizimin</a><a class="back-link" href="index.html">← ホームへ戻る</a></header>
<div class="account-layout">
<nav class="account-nav" aria-label="アカウント設定"><button class="active" type="button">プロフィール</button><button type="button" disabled>アカウント</button><button type="button" disabled>セキュリティ</button></nav>
<section class="settings-card">
<div class="settings-head"><div><h1>プロフィール設定</h1><p>あなたのKiziminプロフィールを整えます。</p></div><span class="status-dot">アカウント正常</span></div>
<div class="profile-preview"><div id="avatar" class="avatar">K</div><div><div id="preview-name" class="preview-name">読み込み中…</div><div id="preview-user" class="preview-user">@username</div></div></div>
<div class="form-section"><h2>基本情報</h2><p class="section-note">記事やコメントで表示されるプロフィール情報です。</p>
<div class="field"><label for="display">表示名</label><input id="display" maxlength="100" autocomplete="name" placeholder="表示名を入力"></div>
<div class="field"><label for="username">ユーザー名</label><input id="username" maxlength="50" autocomplete="username" placeholder="ユーザー名を入力"><small>プロフィールURLなどで使う名前です。</small></div>
<div class="field"><label for="bio">自己紹介</label><textarea id="bio" maxlength="1000" placeholder="あなたについて一言"></textarea><small><span id="bio-count">0</span> / 1000文字</small></div>
</div>
<div class="form-section"><h2>ログイン情報</h2><p class="section-note">メールアドレスはプロフィール情報とは別に管理されています。</p><div id="email" class="email-box">読み込み中…</div></div>
<div class="save-row"><p id="message" aria-live="polite"></p><button id="save" class="save-button" type="button">変更を保存</button></div>
<div class="hint-card">プロフィールを保存しても、パスワードやログイン用メールアドレスは変更されません。</div>
</section></div></main>
<script src="js/ban-screen.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=supabase.createClient("https://bimddapbkdakspjaemsm.supabase.co","sb_publishable_JSnuaf48KMeQ4sodofBg8A_RGlhFHpf");let uid=null;
const $=id=>document.getElementById(id),msg=$("message");
const friendlyError=e=>/duplicate key|already exists/i.test(String(e?.message||""))?"そのユーザー名はすでに使用されています。":/permission denied|row-level security/i.test(String(e?.message||""))?"この操作を行う権限がありません。":"保存に失敗しました。しばらくしてからもう一度お試しください。";
function updatePreview(){const n=$("display").value.trim()||"名前未設定",u=$("username").value.trim();$("preview-name").textContent=n;$("preview-user").textContent=u?"@"+u:"@username";$("avatar").textContent=n.slice(0,1).toUpperCase();$("bio-count").textContent=$("bio").value.length}
["display","username","bio"].forEach(id=>$(id).addEventListener("input",updatePreview));
(async()=>{const {data,error}=await sb.auth.getSession();if(error||!data.session){location.href="login.html";return}uid=data.session.user.id;$("email").textContent=data.session.user.email||"";const {data:p,error:pe}=await sb.from("profiles").select("display_name,username,bio").eq("id",uid).single();if(pe){msg.textContent="プロフィールを読み込めませんでした。";return}$("display").value=p?.display_name||"";$("username").value=p?.username||"";$("bio").value=p?.bio||"";updatePreview()})();
$("save").onclick=async()=>{const b=$("save");b.disabled=true;msg.textContent="保存しています…";const {error}=await sb.from("profiles").update({display_name:$("display").value.trim(),username:$("username").value.trim()||null,bio:$("bio").value.trim()||null}).eq("id",uid);b.disabled=false;msg.textContent=error?friendlyError(error):"保存しました。";if(!error)updatePreview()};
</script><script src="js/access.js"></script>
</body></html>
