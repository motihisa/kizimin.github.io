<!doctype html>
<html lang="ja">
<head>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ログイン・アカウント作成 | Kizimin</title>
<link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/kizimin-redesign.css?v=20261029-redesign1">
</head>
<body>
<main class="container" style="max-width:520px;padding-top:72px;padding-bottom:80px">
<a class="logo" href="index.html">Kizimin</a>

<div class="card" style="padding:28px;margin-top:28px">
<h1 id="title">ログイン</h1>

<div class="form-group">
<label class="form-label" for="email">メールアドレス</label>
<input id="email" class="form-input" type="email" autocomplete="email" required>
</div>

<div class="form-group">
<label class="form-label" for="password">パスワード</label>
<input id="password" class="form-input" type="password" autocomplete="current-password" minlength="6" required>
</div>

<div id="confirmGroup" class="form-group hidden">
<label class="form-label" for="passwordConfirm">パスワード（確認）</label>
<input id="passwordConfirm" class="form-input" type="password" autocomplete="new-password" minlength="6">
</div>

<div id="legalConsentGroup" class="form-group hidden" style="padding:14px;border:1px solid #ddd;border-radius:12px;background:#fafafa">
  <label style="display:flex;align-items:flex-start;gap:10px;line-height:1.7;cursor:pointer">
    <input id="legalConsent" type="checkbox" style="margin-top:6px;flex:0 0 auto">
    <span><a href="terms.html" target="_blank" rel="noopener noreferrer">利用規約</a>と<a href="privacy.html" target="_blank" rel="noopener noreferrer">プライバシーポリシー</a>を読み、内容に同意します。</span>
  </label>
  <p class="text-muted" style="margin:8px 0 0;font-size:13px">アカウント作成には、両方への同意が必要です。</p>
</div>

<div id="accountTypeGroup" class="form-group hidden">
  <label class="form-label" for="accountType">作成するアカウント</label>
  <select id="accountType" class="form-input">
    <option value="personal">個人アカウント</option>
    <option value="organization">団体アカウント（審査あり）</option>
  </select>
  <p class="text-muted" style="font-size:13px;margin-top:6px">団体アカウントは登録と同時に申請できます。承認されるまでは団体名義で投稿できません。</p>
</div>

<div id="organizationFields" class="form-group hidden" style="padding:16px;border:1px solid #ddd;border-radius:12px;background:#fafafa">
  <h2 style="font-size:17px;margin:0 0 12px">団体情報</h2>
  <label class="form-label" for="orgName">団体名</label>
  <input id="orgName" class="form-input" maxlength="120" placeholder="団体・サークル名">
  <label class="form-label" for="orgType" style="margin-top:12px">団体の種類</label>
  <select id="orgType" class="form-input">
    <option value="company">企業・事業者</option><option value="school">学校・教育関係</option><option value="circle">サークル・グループ</option><option value="community">オンラインコミュニティ</option><option value="individual">個人運営の団体</option><option value="other">その他</option>
  </select>
  <label class="form-label" for="orgRepresentative" style="margin-top:12px">代表者名</label>
  <input id="orgRepresentative" class="form-input" maxlength="100" placeholder="代表者の氏名・活動名">
  <label class="form-label" for="orgContactEmail" style="margin-top:12px">連絡用メールアドレス</label>
  <input id="orgContactEmail" class="form-input" type="email" maxlength="254" placeholder="連絡を受け取れるメールアドレス">
  <label class="form-label" for="orgWebsite" style="margin-top:12px">公式サイト（任意）</label>
  <input id="orgWebsite" class="form-input" type="url" maxlength="500" placeholder="https://example.com">
  <label class="form-label" for="orgDescription" style="margin-top:12px">団体の説明</label>
  <textarea id="orgDescription" class="form-input" maxlength="3000" rows="4" placeholder="活動内容や団体の目的"></textarea>
</div>

<button id="submit" class="write-button" type="button">ログイン</button>
<button id="switch" class="login" style="width:100%;margin-top:10px" type="button">アカウントを作成する</button>
<p id="message" class="text-muted"></p>
</div>
</main>

<script src="js/ban-screen.js?v=20261027-account-editor3"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = supabase.createClient(
  "https://bimddapbkdakspjaemsm.supabase.co",
  "sb_publishable_JSnuaf48KMeQ4sodofBg8A_RGlhFHpf"
);

const title = document.querySelector("#title");
const submit = document.querySelector("#submit");
const switchButton = document.querySelector("#switch");
const confirmGroup = document.querySelector("#confirmGroup");
const legalConsentGroup = document.querySelector("#legalConsentGroup");
const legalConsent = document.querySelector("#legalConsent");
const accountTypeGroup = document.querySelector("#accountTypeGroup");
const accountType = document.querySelector("#accountType");
const organizationFields = document.querySelector("#organizationFields");
const message = document.querySelector("#message");
let signupMode = false;

function updateAccountTypeFields() {
  const isOrganization = signupMode && accountType.value === "organization";
  organizationFields.classList.toggle("hidden", !isOrganization);
  ["orgName", "orgRepresentative", "orgContactEmail"].forEach(id => {
    document.getElementById(id).required = isOrganization;
  });
  if (isOrganization && !document.querySelector("#orgContactEmail").value.trim()) {
    document.querySelector("#orgContactEmail").value = document.querySelector("#email").value.trim();
  }
}

function getOrganizationApplication() {
  return {
    organization_name: document.querySelector("#orgName").value.trim(),
    organization_type: document.querySelector("#orgType").value,
    representative_name: document.querySelector("#orgRepresentative").value.trim(),
    contact_email: document.querySelector("#orgContactEmail").value.trim(),
    website: document.querySelector("#orgWebsite").value.trim() || null,
    description: document.querySelector("#orgDescription").value.trim()
  };
}

async function submitPendingOrganizationApplication(user) {
  const key = "kizimin:pending-organization-application";
  let pending;
  try { pending = JSON.parse(localStorage.getItem(key) || "null"); } catch { pending = null; }
  if (!pending || !user?.id || String(pending.email || "").toLowerCase() !== String(user.email || "").toLowerCase()) return false;
  const { data: existing, error: existingError } = await sb.from("organization_applications")
    .select("id").eq("applicant_id", user.id).eq("status", "pending").limit(1);
  if (existingError) throw existingError;
  if (!existing?.length) {
    const { error } = await sb.from("organization_applications").insert({
      applicant_id: user.id, ...pending.application, status: "pending"
    });
    if (error) throw error;
  }
  localStorage.removeItem(key);
  return true;
}

function getPostAuthDestination() {
  const next = new URLSearchParams(location.search).get("next");
  if (!next) return "index.html";
  try {
    const target = new URL(next, location.origin);
    const siteBase = new URL(".", location.href).pathname;
    if (target.origin !== location.origin || !target.pathname.startsWith(siteBase)) return "index.html";
    return target.href;
  } catch {
    return "index.html";
  }
}

function friendlyError(error) { const m=String(error?.message||""); if(/Invalid login credentials/i.test(m)) return "メールアドレスまたはパスワードが正しくありません。"; if(/User already registered/i.test(m)) return "このメールアドレスはすでに登録されています。"; if(/Email not confirmed/i.test(m)) return "メールアドレスの確認が完了していません。確認メールを確認してください。"; return "処理に失敗しました。しばらくしてからもう一度お試しください。"; }

function setMessage(text) {
  message.textContent = text;
}

function setMode(isSignup) {
  signupMode = isSignup;
  title.textContent = isSignup ? "アカウント作成" : "ログイン";
  submit.textContent = isSignup ? "アカウントを作成" : "ログイン";
  switchButton.textContent = isSignup ? "ログインに戻る" : "アカウントを作成する";
  confirmGroup.classList.toggle("hidden", !isSignup);
  legalConsentGroup.classList.toggle("hidden", !isSignup);
  accountTypeGroup.classList.toggle("hidden", !isSignup);
  if (!isSignup) legalConsent.checked = false;
  updateAccountTypeFields();
  setMessage("");
}

function values() {
  return {
    email: document.querySelector("#email").value.trim(),
    password: document.querySelector("#password").value,
    confirm: document.querySelector("#passwordConfirm").value
  };
}

submit.addEventListener("click", async () => {
  const { email, password, confirm } = values();

  if (!email || !password) {
    setMessage("メールアドレスとパスワードを入力してください。");
    return;
  }

  if (password.length < 6) {
    setMessage("パスワードは6文字以上にしてください。");
    return;
  }

  submit.disabled = true;

  try {
    if (!signupMode) {
      const { data: loginData, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
      try {
        await submitPendingOrganizationApplication(loginData.user);
      } catch (applicationError) {
        console.error("団体申請の送信に失敗しました:", applicationError);
        setMessage("ログインしましたが、団体申請を送信できませんでした。団体アカウント画面から申請してください。");
        return;
      }
      location.href = getPostAuthDestination();
      return;
    }

    if (password !== confirm) {
      setMessage("パスワードが一致していません。");
      return;
    }

    if (!legalConsent.checked) {
      setMessage("アカウントを作成するには、利用規約とプライバシーポリシーへの同意が必要です。");
      legalConsent.focus();
      return;
    }

    // Check the submitted email on the server before creating the account.
    // The Edge Function fails open if Check-Mail is temporarily unavailable.
    setMessage("メールアドレスを確認しています...");
    let emailCheckUnavailable = false;
    try {
      const { data: check, error: checkError } = await sb.functions.invoke("signup-email-check", {
        body: { email }
      });
      if (checkError) {
        emailCheckUnavailable = true;
      } else if (check?.error === "INVALID_EMAIL") {
        setMessage("メールアドレスの形式を確認してください。");
        return;
      } else if (check?.blocked === true) {
        const result = check.result || {};
        const details = [];
        if (result.text) details.push(result.text);
        if (result.reason) details.push("判定理由: " + result.reason);
        if (typeof result.risk === "number") details.push("リスクスコア: " + result.risk + "/100");
        if (Array.isArray(result.possible_typo) && result.possible_typo.length) {
          details.push("入力ミスの候補: " + result.possible_typo.join("、"));
        }
        setMessage("このメールアドレスでは登録できません。\n" + (details.join("\n") || "Check-Mailにより登録非推奨と判定されました。"));
        return;
      } else if (check?.unavailable === true || check?.blocked !== false) {
        emailCheckUnavailable = true;
      }
    } catch {
      emailCheckUnavailable = true;
    }

    if (emailCheckUnavailable) {
      setMessage("メール判定サービスに接続できなかったため、確認を省略して登録を続行します。");
    }

    const isOrganization = accountType.value === "organization";
    const organizationApplication = isOrganization ? getOrganizationApplication() : null;
    if (isOrganization) {
      if (!organizationApplication.organization_name || !organizationApplication.representative_name || !organizationApplication.contact_email) {
        setMessage("団体名・代表者名・連絡用メールアドレスを入力してください。");
        return;
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(organizationApplication.contact_email)) {
        setMessage("連絡用メールアドレスの形式を確認してください。");
        return;
      }
      if (organizationApplication.website && !/^https?:\/\//i.test(organizationApplication.website)) {
        setMessage("公式サイトは https:// から始まるURLを入力してください。");
        return;
      }
    }

    const { data, error } = await sb.auth.signUp({ email, password });
    if (error) throw error;

    if (isOrganization) {
      const pending = { email, application: organizationApplication };
      if (data.session && data.user) {
        const { error: applicationError } = await sb.from("organization_applications").insert({
          applicant_id: data.user.id, ...organizationApplication, status: "pending"
        });
        if (applicationError) {
          console.error("団体申請エラー:", applicationError);
          setMessage("アカウントは作成されましたが、団体申請を送信できませんでした。ログイン後、団体アカウント画面から申請してください。");
          return;
        }
        setMessage("アカウントと団体申請を作成しました。管理者の審査結果をお待ちください。");
        location.href = "organization.html";
      } else {
        localStorage.setItem("kizimin:pending-organization-application", JSON.stringify(pending));
        setMessage("アカウントを作成しました。確認メールで認証した後、このメールアドレスでログインすると団体申請が自動送信されます。");
      }
      return;
    }

    if (data.session) {
      setMessage("アカウントを作成しました。");
      location.href = getPostAuthDestination();
    } else {
      setMessage("アカウントを作成しました。確認メールを確認してください。");
    }
  } catch (error) {
    setMessage(friendlyError(error));
  } finally {
    submit.disabled = false;
  }
});

switchButton.addEventListener("click", () => setMode(!signupMode));
accountType.addEventListener("change", updateAccountTypeFields);
document.querySelector("#email").addEventListener("input", () => {
  const contact = document.querySelector("#orgContactEmail");
  if (!contact.value.trim()) contact.value = document.querySelector("#email").value.trim();
});

sb.auth.getSession().then(async ({ data }) => {
  if (!data.session) return;
  try {
    const submittedOrganizationApplication = await submitPendingOrganizationApplication(data.session.user);
    location.href = submittedOrganizationApplication ? "organization.html" : getPostAuthDestination();
  } catch (error) {
    console.error("団体申請の送信に失敗しました:", error);
    setMessage("ログイン状態ですが、団体申請を送信できませんでした。団体アカウント画面から申請してください。");
  }
});
</script>
<script src="js/access.js"></script>
<script src="js/kizimin-emoji.js?v=20261015-emoji1" defer></script>
</body>
</html>
