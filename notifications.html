<!doctype html>
<html lang="ja">
<head>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>通知 | Kizimin</title><link rel="stylesheet" href="css/style.css">
<style>
.notify-wrap{max-width:760px;margin:auto;padding:40px 20px 80px}.page-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}.page-head h1{margin:0;font-size:30px}.page-head p{margin:5px 0 0;color:#777;font-size:13px}.notify-list{border-top:1px solid var(--border)}.notify-item{padding:18px 4px;border-bottom:1px solid var(--border);display:block}.notify-item.unread{background:#fafafa}.notify-title{font-weight:700}.notify-body{margin:4px 0;color:#555;white-space:pre-wrap;overflow-wrap:anywhere}.notify-meta{font-size:12px;color:#999}.notify-empty{padding:60px 20px;text-align:center;color:#999}.notify-actions{display:flex;gap:8px}.notify-btn{border:1px solid #ddd;background:#fff;border-radius:9px;padding:8px 12px;cursor:pointer}
</style></head>
<body>
<header class="header"><div class="header-inner"><a class="logo" href="index.html">Kizimin</a><div class="header-actions"><a class="login" href="dm.html">DM</a><a class="login" href="index.html">ホーム</a></div></div></header>
<main class="notify-wrap">
<div class="page-head"><div><h1>通知</h1><p>あなたへのお知らせを確認できます。</p></div><div class="notify-actions"><button id="read-all" class="notify-btn" type="button">すべて既読</button></div></div>
<div id="notify-list" class="notify-list"><div class="loading">通知を読み込んでいます…</div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=supabase.createClient("https://bimddapbkdakspjaemsm.supabase.co","sb_publishable_JSnuaf48KMeQ4sodofBgA8_RGlhFHpf");
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const fmt=v=>new Intl.DateTimeFormat("ja-JP",{dateStyle:"medium",timeStyle:"short"}).format(new Date(v));
async function api(action,extra={}){
  const {data,error}=await sb.functions.invoke("secure-content",{body:{action,...extra}});
  if(error) throw new Error(error.message||"FUNCTION_ERROR");
  if(data?.error) throw new Error(data.error);
  return data;
}
async function init(){
  const {data,error}=await sb.auth.getSession();
  if(error||!data.session){location.href="login.html";return}
  try{
    const data=await api("notifications_list");
    const rows=data.notifications||[];
    if(!rows.length){$("notify-list").innerHTML='<div class="notify-empty">通知はありません。</div>';return}
    $("notify-list").innerHTML=rows.map(n=>'<article class="notify-item '+(!n.read_at?"unread":"")+'" data-id="'+esc(n.id)+'"><div class="notify-title">'+esc(n.title)+'</div><div class="notify-body">'+esc(n.body)+'</div><div class="notify-meta">'+esc(fmt(n.created_at))+'</div></article>').join("");
    document.querySelectorAll(".notify-item").forEach((el,i)=>el.addEventListener("click",async()=>{
      const n=rows[i];
      if(!n)return;
      if(!n.read_at){try{await api("notifications_mark_read",{notification_id:n.id})}catch{}}
      if(n.link_url)location.href=n.link_url;
    }));
    rows.filter(n=>!n.read_at).forEach(n=>api("notifications_mark_read",{notification_id:n.id}).catch(()=>{}));
  }catch(e){
    console.error("notifications_list failed:",e);
    $("notify-list").innerHTML='<div class="notify-empty">通知を読み込めませんでした。<br><small>認証またはサーバー側の処理でエラーが発生しました。</small></div>';
  }
}
$("read-all").onclick=async()=>{
  try{await api("notifications_mark_read");location.reload()}
  catch(e){alert("通知を既読にできませんでした。")}
};
init();
</script>
</script>
</body></html>
