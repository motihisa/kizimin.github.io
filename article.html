<script>
const sb=supabase.createClient("https://bimddapbkdakspjaemsm.supabase.co","sb_publishable_JSnuaf48KMeQ4sodofBg8A_RGlhFHpf");
const escapeHtml=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function renderArticleContent(v){
  const colorTokens=[];
  const source=String(v??"").replace(/\{\{color:(#[0-9a-fA-F]{6})\|([\s\S]*?)\}\}/g,(_,color,text)=>{
    const token="KIZIMINCOLOR"+colorTokens.length+"TOKEN";
    colorTokens.push({token,color,text});
    return token;
  });
  const options={gfm:true,breaks:true};
  let html=window.marked?marked.parse(source,options):escapeHtml(source).replace(/\n/g,"<br>");
  html=window.DOMPurify?DOMPurify.sanitize(html,{USE_PROFILES:{html:true}}):escapeHtml(source).replace(/\n/g,"<br>");
  for(const item of colorTokens){
    let inner=window.marked?marked.parseInline(item.text,options):escapeHtml(item.text);
    if(window.DOMPurify)inner=DOMPurify.sanitize(inner,{USE_PROFILES:{html:true}});
    html=html.split(item.token).join('<span style="color:'+item.color+'">'+inner+'</span>');
  }
  return html;
}
const id=new URLSearchParams(location.search).get("id");
const article=document.getElementById("article");
const commentsList=document.getElementById("comments-list");
const badge=t=>t?'<span class="official-badge">'+escapeHtml(t)+'</span>':"";
async function setupFollowButtons(root){
  const buttons=[...(root||document).querySelectorAll("[data-follow-user]")];
  if(!buttons.length)return;
  const {data:{session}}=await sb.auth.getSession();
  const me=session?.user?.id||null;
  const targets=[...new Set(buttons.map(b=>b.dataset.followUser).filter(Boolean))];
  buttons.forEach(button=>{
    if(me&&button.dataset.followUser===me){button.hidden=true;return;}
    button.hidden=false;button.textContent="フォロー";button.setAttribute("aria-pressed","false");
    button.title=me?"このユーザーをフォロー":"フォローするにはログインしてください";
  });
  if(!me){
    buttons.forEach(button=>button.addEventListener("click",()=>{location.href="login.html";},{once:true}));
    return;
  }
  const {data:rows,error}=await sb.from("follows").select("following_id").eq("follower_id",me).in("following_id",targets);
  if(error)console.warn("フォロー状態の取得に失敗しました:",error);
  const following=new Set((rows||[]).map(row=>row.following_id));
  buttons.forEach(button=>{
    const target=button.dataset.followUser;
    if(!target||target===me){button.hidden=true;return;}
    let isFollowing=following.has(target);
    const paint=()=>{button.textContent=isFollowing?"フォロー中":"フォロー";button.setAttribute("aria-pressed",String(isFollowing));button.title=isFollowing?"クリックしてフォロー解除":"このユーザーをフォロー";};
    paint();
    button.addEventListener("click",async()=>{
      if(button.disabled)return;
      button.disabled=true;
      try{
        if(isFollowing){
          const {error:deleteError}=await sb.from("follows").delete().eq("follower_id",me).eq("following_id",target);
          if(deleteError)throw deleteError;
          isFollowing=false;
        }else{
          const {error:insertError}=await sb.from("follows").insert({follower_id:me,following_id:target});
          if(insertError){if(insertError.code==="23505")isFollowing=true;else throw insertError;}else isFollowing=true;
        }
        paint();
      }catch(error){console.error("フォロー処理に失敗しました:",error);alert("フォローを変更できませんでした。ログイン状態や通信を確認してください。");}
      finally{button.disabled=false;}
    });
  });
}

async function secureContent(action, payload={}) {
  const {data:{session}} = await sb.auth.getSession();
  if(!session?.access_token) throw new Error("ログインが必要です。");
  const response = await fetch("https://bimddapbkdakspjaemsm.supabase.co/functions/v1/secure-content", {
    method:"POST",
    headers:{"Content-Type":"application/json","apikey":"sb_publishable_JSnuaf48KMeQ4sodofBg8A_RGlhFHpf","Authorization":"Bearer "+session.access_token},
    body:JSON.stringify({action,...payload})
  });
  const result=await response.json().catch(()=>({}));
  if(!response.ok) throw new Error(result.error||"コメント処理に失敗しました。");
  return result;
}
async function initArticleActions(articleId){
  const likeButton=document.getElementById("article-like-button");
  const likeCount=document.getElementById("article-like-count");
  const reportToggle=document.getElementById("article-report-toggle");
  const reportForm=document.getElementById("article-report-form");
  const reportCancel=document.getElementById("article-report-cancel");
  const actionMessage=document.getElementById("article-action-message");
  if(!likeButton||!likeCount||!reportToggle||!reportForm)return;
  let liked=false;
  const refreshLikeState=async()=>{
    const [{count,error:countError},{data:{session}}]=await Promise.all([
      sb.from("article_likes").select("user_id",{count:"exact",head:true}).eq("article_id",articleId),
      sb.auth.getSession()
    ]);
    if(countError) throw countError;
    likeCount.textContent=String(count||0);
    if(session?.user?.id){
      const {data,error}=await sb.from("article_likes").select("article_id").eq("article_id",articleId).eq("user_id",session.user.id).maybeSingle();
      if(error)throw error;
      liked=!!data;
    }else liked=false;
    likeButton.setAttribute("aria-pressed",String(liked));
    likeButton.innerHTML=(liked?"♥ いいね済み ":"♡ いいね ")+ '<span id="article-like-count">'+String(count||0)+'</span>';
  };
  try{await refreshLikeState();}catch(error){console.warn("いいね状態を取得できませんでした:",error);}
  likeButton.addEventListener("click",async()=>{
    likeButton.disabled=true;
    try{
      const {data:{session}}=await sb.auth.getSession();
      if(!session?.user?.id){location.href="login.html";return;}
      const result=liked
        ? await sb.from("article_likes").delete().eq("article_id",articleId).eq("user_id",session.user.id)
        : await sb.from("article_likes").insert({article_id:articleId,user_id:session.user.id});
      if(result.error)throw result.error;
      liked=!liked;
      await refreshLikeState();
      actionMessage.textContent=liked?"いいねしました。":"いいねを取り消しました。";
    }catch(error){
      console.error("いいね処理に失敗しました:",error);
      actionMessage.textContent="いいねを反映できませんでした。ログイン状態や通信を確認してください。";
    }finally{likeButton.disabled=false;}
  });
  reportToggle.addEventListener("click",async()=>{
    const {data:{session}}=await sb.auth.getSession();
    if(!session?.user?.id){location.href="login.html";return;}
    reportForm.hidden=!reportForm.hidden;
    reportToggle.setAttribute("aria-expanded",String(!reportForm.hidden));
    if(!reportForm.hidden)document.getElementById("article-report-reason")?.focus();
  });
  reportCancel?.addEventListener("click",()=>{reportForm.reset();reportForm.hidden=true;reportToggle.setAttribute("aria-expanded","false");});
  reportForm.addEventListener("submit",async event=>{
    event.preventDefault();
    const {data:{session}}=await sb.auth.getSession();
    if(!session?.user?.id){actionMessage.textContent="通報にはログインが必要です。";return;}
    const reason=document.getElementById("article-report-reason").value;
    const detail=document.getElementById("article-report-detail").value.trim();
    const combined=[reason,detail].filter(Boolean).join("：").slice(0,1000);
    const submit=document.getElementById("article-report-submit");
    submit.disabled=true;submit.textContent="送信中…";
    try{
      const {error}=await sb.from("reports").insert({reporter_id:session.user.id,article_id:articleId,reason:combined,status:"open"});
      if(error)throw error;
      reportForm.reset();reportForm.hidden=true;
      actionMessage.textContent="通報を送信しました。運営が確認します。";
    }catch(error){
      console.error("通報送信に失敗しました:",error);
      actionMessage.textContent="通報を送信できませんでした。ログイン状態や通信を確認してください。";
    }finally{submit.disabled=false;submit.textContent="通報を送信";}
  });
}
async function loadComments(articleId){
  if(!commentsList) return;
  try{
    const result=await secureContent("comment_list",{article_id:articleId});
    const comments=result.comments||[];
    if(!comments.length){commentsList.innerHTML='<div class="empty-state">コメントはまだありません。</div>';return;}
    const authorIds=[...new Set(comments.map(c=>c.author_id).filter(Boolean))];
    const [titlesResult,profilesResult]=await Promise.all([
      authorIds.length?sb.from("profile_titles").select("user_id,title").in("user_id",authorIds):Promise.resolve({data:[]}),
      authorIds.length?sb.from("profiles").select("id,display_name,username,avatar_url").in("id",authorIds):Promise.resolve({data:[]})
    ]);
    const titles=new Map((titlesResult.data||[]).map(t=>[t.user_id,t.title]));
    const commentProfiles=new Map((profilesResult.data||[]).map(p=>[p.id,p]));
    commentsList.innerHTML=comments.map(c=>{
      const p=commentProfiles.get(c.author_id)||c.profiles||{};
      const name=p.display_name||p.username||"ユーザー";
      const initial=escapeHtml((name||"K").trim().slice(0,1).toUpperCase());
      const commentAvatar=p.avatar_url?'<img class="comment-author-avatar" src="'+escapeHtml(p.avatar_url)+'" alt="" loading="lazy">':'<span class="comment-author-fallback" aria-hidden="true">'+initial+'</span>';
      const date=c.created_at?new Intl.DateTimeFormat("ja-JP",{year:"numeric",month:"long",day:"numeric",hour:"2-digit",minute:"2-digit"}).format(new Date(c.created_at)):"";
      const commentLiked=!!c.liked_by_me;
      const commentLikeCount=Number(c.like_count)||0;
      return '<div class="comment"><div class="comment-author-row">'+commentAvatar+'<div style="font-weight:600;min-width:0"><a href="profile.html?id='+encodeURIComponent(c.author_id||"")+'">'+escapeHtml(name)+'</a>'+badge(titles.get(c.author_id))+(c.author_id?'<button type="button" class="inline-follow-button" data-follow-user="'+escapeHtml(c.author_id)+'">フォロー</button>':'')+'</div></div><div class="text-muted">'+escapeHtml(date)+'</div><div class="comment-content" style="white-space:pre-wrap">'+escapeHtml(c.content)+'</div><div class="comment-like-row"><button type="button" class="comment-like-button" data-comment-id="'+escapeHtml(c.id)+'" aria-pressed="'+String(commentLiked)+'">'+(commentLiked?'♥ いいね済み':'♡ いいね')+' <span>'+commentLikeCount+'</span></button></div></div>';
    }).join("");
    commentsList.querySelectorAll(".comment-author-avatar").forEach(img=>img.addEventListener("error",()=>{const fallback=document.createElement("span");fallback.className="comment-author-fallback";fallback.textContent=(img.closest(".comment-author-row")?.querySelector("a")?.textContent||"K").trim().slice(0,1).toUpperCase();img.replaceWith(fallback);},{once:true}));
    await setupFollowButtons(commentsList);
    commentsList.querySelectorAll(".comment-like-button").forEach(button=>{
      button.addEventListener("click",async()=>{
        button.disabled=true;
        try{
          await secureContent("comment_like_toggle",{comment_id:button.dataset.commentId});
          await loadComments(articleId);
        }catch(error){
          if(error.message==="ログインが必要です。"){location.href="login.html";return;}
          const message=document.getElementById("comment-message");
          if(message)message.textContent="いいねを反映できませんでした。"+(error.message||"通信状態を確認してください。");
        }finally{button.disabled=false;}
      });
    });
  }catch(error){
    console.error("コメントの読み込みに失敗しました:",error);
    commentsList.innerHTML='<div class="empty-state">'+escapeHtml(error.message||"コメントを読み込めませんでした。")+'</div>';
  }
}
document.getElementById("comment-form").addEventListener("submit",async event=>{

  const button=document.getElementById("comment-submit");
  const content=input.value.trim();
  if(!content)return;
  button.disabled=true; message.textContent="投稿しています…";

    await secureContent("comment_add",{article_id:id,content});
    input.value=""; message.textContent="コメントを投稿しました。";
    await loadComments(id);
  }catch(error){
    message.textContent=error.message==="ログインが必要です。"?"コメントするにはログインしてください。":("投稿できませんでした: "+error.message);
  }finally{button.disabled=false;}
});

(async()=>{
  if(!id){article.innerHTML='<div class="empty-state">記事が指定されていません。</div>';commentsList.innerHTML='<div class="empty-state">記事が指定されていません。</div>';return;}
  try{
    const {data,error}=await sb.from("articles").select("id,title,content,excerpt,published_at,created_at,author_id,category_id,organization_id,organization_posted_by").eq("id",id).eq("status","published").single();
    if(error||!data){article.innerHTML='<div class="empty-state">記事が見つかりません。</div>';commentsList.innerHTML='<div class="empty-state">記事が見つかりません。</div>';return;}const currentArticleSelect=document.getElementById("save-article-select");if(currentArticleSelect)currentArticleSelect.innerHTML='<option value="'+escapeHtml(data.id)+'">'+escapeHtml(data.title)+'</option>';
    let author="ユーザー",category="その他",authorTitle="",authorAvatarUrl="",organizationName="";
    if(data.author_id){
      const {data:profile,error:profileError}=await sb.from("profiles").select("display_name,username,avatar_url").eq("id",data.author_id).maybeSingle();
      if(profileError) console.warn("記事著者情報の取得に失敗しました:",profileError);
      if(profile){author=profile.display_name||profile.username||author;authorAvatarUrl=profile.avatar_url||"";}
      const {data:titleRow}=await sb.from("profile_titles").select("title").eq("user_id",data.author_id).maybeSingle();
      authorTitle=titleRow?.title||"";
    }
    if(data.organization_id){
      const {data:organization,error:organizationError}=await sb.from("organizations").select("name").eq("id",data.organization_id).maybeSingle();
      if(organizationError) console.warn("団体情報の取得に失敗しました:",organizationError);
      organizationName=organization?.name||"";
    }
    if(data.category_id){
      const {data:categoryRow,error:categoryError}=await sb.from("categories").select("name").eq("id",data.category_id).maybeSingle();
      if(categoryError) console.warn("記事カテゴリ情報の取得に失敗しました:",categoryError);
      if(categoryRow?.name) category=categoryRow.name;
    }
    const publishedDate=escapeHtml(new Intl.DateTimeFormat("ja-JP",{year:"numeric",month:"long",day:"numeric"}).format(new Date(data.published_at||data.created_at)));
    const authorInitial=escapeHtml((author||"K").trim().slice(0,1).toUpperCase());
    const authorAvatar=authorAvatarUrl?'<img src="'+escapeHtml(authorAvatarUrl)+'" alt="" loading="lazy">':authorInitial;
    const authorIdentity=organizationName?'<span class="author-name">'+escapeHtml(organizationName)+'</span><span class="official-badge">団体アカウント</span><small style="display:block;font-size:12px;color:#777;margin-top:4px">実際の投稿者: '+escapeHtml(author)+'</small>':'<a class="author-name" href="profile.html?id='+encodeURIComponent(data.author_id||"")+'">'+escapeHtml(author)+'</a>'+badge(authorTitle)+(data.author_id?'<button type="button" class="inline-follow-button" data-follow-user="'+escapeHtml(data.author_id)+'">フォロー</button>':"");
    article.innerHTML='<div class="article-cover"><div class="article-kicker"><span class="article-dot"></span> KIZIMIN JOURNAL</div><div class="article-meta"><span class="article-category">'+escapeHtml(category)+'</span><span>'+publishedDate+'</span><span>·</span><span>読む時間のひととき</span></div><h1 class="article-title">'+escapeHtml(data.title)+'</h1><div class="article-author-row"><span class="author-avatar" aria-hidden="true">'+authorAvatar+'</span><div class="article-author-details"><span class="author-label">'+(organizationName?"団体名義の記事":"この記事を書いた人")+'</span><div>'+authorIdentity+'</div></div></div></div><div class="article-divider"></div><div class="article-body markdown-rendered">'+renderArticleContent(data.content)+'</div><div class="article-endnote">最後まで読んでくれてありがとう</div>';
    const {data:{session:editSession}}=await sb.auth.getSession();
    if(editSession?.user?.id){
      let canEdit=data.author_id===editSession.user.id;
      if(!canEdit){
        const {data:collabMembership}=await sb.from("article_collaborators").select("id").eq("article_id",data.id).eq("user_id",editSession.user.id).maybeSingle();
        canEdit=!!collabMembership;
      }
      if(canEdit){
        const editWrap=document.createElement("div");
        editWrap.style.cssText="display:flex;justify-content:flex-end;margin:0 0 18px";
        editWrap.innerHTML='<a href="edit-article.html?id='+encodeURIComponent(data.id)+'" style="display:inline-flex;align-items:center;gap:8px;padding:10px 15px;border:1px solid #dcd7ff;border-radius:12px;background:#f5f3ff;color:#594bd6;text-decoration:none;font-size:13px;font-weight:800">✎ 記事を編集・共同編集</a>';
        article.prepend(editWrap);
      }
    }
    const articleAvatarImage=article.querySelector(".author-avatar img");
    if(articleAvatarImage)articleAvatarImage.addEventListener("error",()=>{articleAvatarImage.replaceWith(document.createTextNode(authorInitial));},{once:true});
    document.title=data.title+" | Kizimin";
    await setupFollowButtons(article);
    await initArticleActions(data.id);
    await loadComments(data.id);
  }catch(error){
    console.error("記事の読み込みに失敗しました:",error);
    article.innerHTML='<div class="empty-state">記事を読み込めませんでした。権限または通信状態を確認してください。</div>';
    commentsList.innerHTML='<div class="empty-state">コメントを読み込めませんでした。権限または通信状態を確認してください。</div>';
  }
})();
