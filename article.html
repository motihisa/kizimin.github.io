<!doctype html>
<html lang="ja">
<head>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>記事 | Kizimin</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<main class="container" style="max-width:820px;padding-top:48px;padding-bottom:90px">
<a class="logo" href="index.html">Kizimin</a>
<article id="article" class="card" style="padding:32px;margin-top:28px">
<div class="loading">記事を読み込んでいます…</div>
</article>
</main>
<script src="js/ban-screen.js"></script>
<script src="js/maintenance-gate.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=supabase.createClient("https://bimddapbkdakspjaemsm.supabase.co","sb_publishable_JSnuaf48KMeQ4sodofBg8A_RGlhFHpf");
const escapeHtml=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function renderMarkdown(v){
  let s=escapeHtml(v),code=[];
  s=s.replace(/\`([^\`]+)\`/g,(_,x)=>{code.push(x);return "@@CODE"+(code.length-1)+"@@";});
  s=s.replace(/^### (.+)$/gm,"<h3>$1</h3>").replace(/^## (.+)$/gm,"<h2>$1</h2>").replace(/^# (.+)$/gm,"<h1>$1</h1>").replace(/^> (.+)$/gm,"<blockquote>$1</blockquote>").replace(/^---$/gm,"<hr>");
  s=s.replace(/^(?:-|*) (.+)$/gm,"<li>$1</li>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/\*([^*]+)\*/g,"<em>$1</em>");
  s=s.replace(/(?:<li>.*<\/li>\n?)+/g,x=>"<ul>"+x+"</ul>").replace(/\n/g,"<br>");
  return s.replace(/@@CODE(\d+)@@/g,(_,i)=>"<code>"+code[i]+"</code>");
}
const renderArticleBody=v=>escapeHtml(v).split(/\r?\n/).map(line=>line.trim()==="---"?"<hr>":line).join("\n").replace(/\n/g,"<br>");
const id=new URLSearchParams(location.search).get("id");
(async()=>{
 if(!id){article.innerHTML='<div class="empty-state">記事が指定されていません。</div>';return;}
 try {
   // 記事本体と関連情報を分離して取得し、著者・カテゴリ側のRLSや
   // リレーション解決エラーで記事本文まで表示不能にならないようにする。
   const {data,error}=await sb.from("articles")
     .select("id,title,content,excerpt,published_at,created_at,author_id,category_id")
     .eq("id",id).eq("status","published").single();
   if(error||!data){article.innerHTML='<div class="empty-state">記事が見つかりません。</div>';return;}

   let author="ユーザー";
   let category="その他";

   if(data.author_id){
     const {data:profile,error:profileError}=await sb.from("profiles")
       .select("display_name,username").eq("id",data.author_id).maybeSingle();
     if(profileError) console.warn("記事著者情報の取得に失敗しました:",profileError);
     if(profile) author=profile.display_name||profile.username||author;
   }

   if(data.category_id){
     const {data:categoryRow,error:categoryError}=await sb.from("categories")
       .select("name").eq("id",data.category_id).maybeSingle();
     if(categoryError) console.warn("記事カテゴリ情報の取得に失敗しました:",categoryError);
     if(categoryRow?.name) category=categoryRow.name;
   }

   article.innerHTML='<div class="article-meta">'+escapeHtml(new Intl.DateTimeFormat("ja-JP",{year:"numeric",month:"long",day:"numeric"}).format(new Date(data.published_at||data.created_at)))+' · '+escapeHtml(category)+'</div><h1>'+escapeHtml(data.title)+'</h1><p class="text-muted">'+escapeHtml(author)+'</p><hr><div style="white-space:pre-wrap;line-height:2">'+escapeHtml(data.content)+'</div>';
   document.title=data.title+" | Kizimin";
 } catch(error) {
   console.error("記事の読み込みに失敗しました:",error);
   article.innerHTML='<div class="empty-state">記事を読み込めませんでした。通信状態または公開記事の権限を確認してください。</div>';
 }
})();
</script>
<script src="js/access.js"></script>
</body></html>
