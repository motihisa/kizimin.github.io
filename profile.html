<!doctype html>
<html lang="ja">
<head>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Kizimin ユーザープロフィール">
  <title>プロフィール | Kizimin</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .profile-page{max-width:820px;margin:0 auto;padding:48px 20px 90px}
    .profile-card{padding:32px}
    .profile-head{display:flex;gap:22px;align-items:center}
    .profile-avatar{width:88px;height:88px;border-radius:50%;object-fit:cover;background:#eee;flex:none}
    .profile-name{margin:0 0 4px}
    .profile-username{margin:0}
    .profile-bio{margin:20px 0;white-space:pre-wrap;line-height:1.8}
    .profile-actions{display:flex;gap:10px;flex-wrap:wrap}
    .profile-stats{display:flex;gap:24px;margin:22px 0;padding-top:18px;border-top:1px solid #eee}
    .profile-stat strong{font-size:1.15rem}
    .profile-stat span{display:block;color:#777;font-size:.85rem}
    .profile-articles{margin-top:24px}
    .profile-article{display:block;padding:18px 0;border-top:1px solid #eee;color:inherit;text-decoration:none}
    .profile-article h3{margin:5px 0}
    .profile-article p{margin:6px 0;color:#666}
    .profile-error{text-align:center;padding:50px 20px}
    .official-badge{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:999px;background:#111;color:#fff;font-size:.72em;font-weight:700;vertical-align:middle;letter-spacing:.02em}
    @media(max-width:600px){.profile-head{align-items:flex-start}.profile-card{padding:22px}.profile-page{padding-top:28px}}
  </style>
</head>
<body>
<main class="profile-page">
  <a class="logo" href="index.html">Kizimin</a>
  <section id="profile" class="card profile-card" style="margin-top:28px">
    <div class="loading">プロフィールを読み込んでいます…</div>
  </section>
</main>
<script src="js/ban-screen.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/maintenance-gate.js"></script>
<script>
const sb=supabase.createClient("https://bimddapbkdakspjaemsm.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJpbWRkYXBia2Rha3NwamFlbXNtIiwiaWF0IjoxNzkxMzE1NDE5LCJleHAiOjIxMDY4OTE0MTl9.qezG4VOkyYfaa4DxClk1PSV7bZEne7WEbxj52m1l7iM");
const box=document.getElementById("profile");
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const userId=new URLSearchParams(location.search).get("id");

async function load(){
  if(!userId){box.innerHTML='<div class="profile-error">ユーザーが指定されていません。</div>';return;}
  try{
    const [{data:p,error:pe},{count:followers,error:fe},{count:following,error:ge},{data:articles,error:ae},{data:meResult}] = await Promise.all([
      sb.from("profiles").select("id,username,display_name,bio,avatar_url,created_at").eq("id",userId).maybeSingle(),
      sb.from("follows").select("*",{count:"exact",head:true}).eq("following_id",userId),
      sb.from("follows").select("*",{count:"exact",head:true}).eq("follower_id",userId),
      sb.from("articles").select("id,title,excerpt,content,published_at,created_at,category_id").eq("author_id",userId).eq("status","published").order("published_at",{ascending:false,nullsFirst:false}).limit(50),
      sb.auth.getUser()
    ]);
    if(pe) throw pe;
    if(fe||ge||ae) console.warn("プロフィール関連データの一部取得に失敗:",fe||ge||ae);
    if(!p){box.innerHTML='<div class="profile-error">ユーザーが見つかりません。</div>';return;}
    const {data:titleRow,error:titleError}=await sb.from("profile_titles").select("title").eq("user_id",userId).maybeSingle();
    if(titleError) console.warn("プロフィール称号の取得に失敗しました:",titleError);
    const me=meResult?.user||null;
    let followingMe=false;
    if(me&&me.id!==userId){
      const {data:followRow}=await sb.from("follows").select("follower_id").eq("follower_id",me.id).eq("following_id",userId).maybeSingle();
      followingMe=!!followRow;
    }
    const display=p.display_name||p.username||"ユーザー";
    const titleBadge=titleRow?.title?'<span class="official-badge">'+esc(titleRow.title)+'</span>':"";
    const avatar=p.avatar_url?'<img class="profile-avatar" src="'+esc(p.avatar_url)+'" alt="">':'<div class="profile-avatar" aria-hidden="true"></div>';
    const action=me&&me.id!==userId
      ? '<button id="follow-button" class="write-button" type="button">'+(followingMe?"フォロー中":"フォロー")+'</button>'
      : "";
    const rows=articles||[];
    box.innerHTML='<div class="profile-head">'+avatar+'<div><h1 class="profile-name">'+esc(display)+titleBadge+'</h1><p class="profile-username text-muted">'+(p.username?'@'+esc(p.username):'')+'</p></div></div>'+
      '<div class="profile-bio">'+esc(p.bio||"自己紹介はまだありません。")+'</div>'+
      '<div class="profile-actions">'+action+'<a class="login" href="dm.html">💬 DM</a></div>'+
      '<div class="profile-stats"><div class="profile-stat"><strong>'+Number(followers||0)+'</strong><span>フォロワー</span></div><div class="profile-stat"><strong>'+Number(following||0)+'</strong><span>フォロー中</span></div><div class="profile-stat"><strong>'+rows.length+'</strong><span>公開記事</span></div></div>'+
      '<div class="profile-articles"><h2>記事</h2>'+
      (rows.length?rows.map(a=>'<a class="profile-article" href="article.html?id='+encodeURIComponent(a.id)+'"><div class="article-meta">'+esc(new Intl.DateTimeFormat("ja-JP",{year:"numeric",month:"long",day:"numeric"}).format(new Date(a.published_at||a.created_at)))+'</div><h3>'+esc(a.title)+'</h3><p>'+esc(a.excerpt||String(a.content||"").slice(0,140))+'</p></a>').join(""):'<div class="empty-state">公開記事はまだありません。</div>')+
      '</div>';
    document.title=display+" | Kizimin";
    const btn=document.getElementById("follow-button");
    if(btn) btn.addEventListener("click",async()=>{
      btn.disabled=true;
      try{
        if(followingMe){
          const {error}=await sb.from("follows").delete().eq("follower_id",me.id).eq("following_id",userId);
          if(error) throw error;
          followingMe=false;
          btn.textContent="フォロー";
        }else{
          const {error}=await sb.from("follows").insert({follower_id:me.id,following_id:userId});
          if(error) throw error;
          followingMe=true;
          btn.textContent="フォロー中";
        }
        location.reload();
      }catch(e){
        console.error(e);
        alert("フォロー処理に失敗しました。");
      }finally{btn.disabled=false;}
    });
  }catch(e){
    console.error("プロフィールの読み込みに失敗しました:",e);
    box.innerHTML='<div class="profile-error">プロフィールを読み込めませんでした。権限または通信状態を確認してください。</div>';
  }
}
load();
</script>
<script src="js/access.js"></script>
</body>
</html>
