<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kizimin 運営専用AI</title>
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/admin.css?v=20261031-admin-ai1"><link rel="stylesheet" href="css/kizimin-redesign.css?v=20261030-metawiki1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.ai-shell{max-width:1100px;margin:0 auto;padding:28px 20px 48px}.ai-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:20px}.ai-head h1{margin:0;font-size:26px}.ai-head p{margin:7px 0 0;color:var(--ad-muted,#64748b)}.ai-notice{padding:12px 15px;border:1px solid var(--ad-line,#dbe2ea);border-radius:12px;background:var(--ad-soft,#f8fafc);color:var(--ad-text,#172033);font-size:13px;line-height:1.8;margin-bottom:16px}.ai-card{background:var(--ad-panel,#fff);border:1px solid var(--ad-line,#dbe2ea);border-radius:18px;padding:18px;box-shadow:0 8px 28px rgba(20,32,60,.05)}.ai-messages{height:min(60vh,650px);min-height:300px;overflow:auto;display:flex;flex-direction:column;gap:14px;padding:4px 2px 18px}.ai-message{max-width:88%;padding:13px 15px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.75;font-size:14px}.ai-message.user{align-self:flex-end;background:#e7efff;color:#15284d}.ai-message.assistant{align-self:flex-start;background:var(--ad-soft,#f1f5f9);color:var(--ad-text,#172033)}.ai-message .meta{display:block;margin-top:8px;font-size:11px;opacity:.7}.ai-form{display:flex;gap:10px;align-items:flex-end;border-top:1px solid var(--ad-line,#dbe2ea);padding-top:15px}.ai-form textarea{flex:1;min-height:54px;max-height:180px;resize:vertical;padding:13px;border:1px solid var(--ad-line,#cbd5e1);border-radius:12px;background:var(--ad-panel,#fff);color:var(--ad-text,#172033);font:inherit}.ai-form button{min-height:48px;padding:0 22px;border:0;border-radius:12px;background:#2457c5;color:white;font-weight:800;cursor:pointer}.ai-form button:disabled{opacity:.55;cursor:wait}.ai-status{font-size:12px;color:var(--ad-muted,#64748b);margin-top:10px;min-height:20px}.ai-back{color:inherit;text-decoration:none;font-weight:700}.ai-error{color:#b42318}.ai-empty{color:var(--ad-muted,#64748b);text-align:center;padding:70px 12px}.ai-clear{border:1px solid var(--ad-line,#dbe2ea);border-radius:10px;padding:9px 13px;background:transparent;color:inherit;cursor:pointer}@media(max-width:600px){.ai-shell{padding:18px 12px}.ai-card{padding:12px}.ai-message{max-width:96%}.ai-form{flex-direction:column;align-items:stretch}.ai-form button{width:100%}}
</style>
</head>
<body class="admin-page">
<main class="ai-shell">
<header class="ai-head"><div><a class="ai-back" href="admin.html">← 管理画面へ戻る</a><h1>✦ 運営専用AI</h1><p>Kiziminの運営作業・仕様整理・障害調査を支援します。</p></div><button class="ai-clear" id="ai-clear" type="button">この画面の会話を消去</button></header>
<div class="ai-notice">運営スタッフ専用です。質問とAIの回答は、監査のため管理者ID・日時とともに保存されます。オーナーは管理コンソールから会話履歴を確認できます。パスワード、APIキー、個人情報などの秘密情報は入力しないでください。</div>
<section class="ai-card">
<div id="ai-messages" class="ai-messages" aria-live="polite"><div class="ai-empty" id="ai-empty">Kiziminの運営について質問できます。</div></div>
<form id="ai-form" class="ai-form"><textarea id="ai-prompt" maxlength="5000" placeholder="例：管理画面の権限設計を整理して" required></textarea><button id="ai-send" type="submit">送信</button></form>
<div id="ai-status" class="ai-status" role="status"></div>
</section>
</main>
<script>
(() => {
"use strict";
const URL="https://bimddapbkdakspjaemsm.supabase.co";
const KEY="sb_publishable_JSnuaf48KMeQ4sodofBg8A_RGlhFHpf";
const WORKER="https://kizimin-ai.mitomaru-1008.workers.dev";
const db=window.supabase.createClient(URL,KEY);
const $=id=>document.getElementById(id);
const messages=$("ai-messages"),form=$("ai-form"),prompt=$("ai-prompt"),send=$("ai-send"),status=$("ai-status");
let conversationId=crypto.randomUUID(),busy=false;
function addMessage(text,kind,meta=""){const empty=$("ai-empty");if(empty)empty.remove();const node=document.createElement("div");node.className="ai-message "+kind;node.textContent=text;if(meta){const m=document.createElement("span");m.className="meta";m.textContent=meta;node.appendChild(m);}messages.appendChild(node);messages.scrollTop=messages.scrollHeight;}
async function init(){
 const {data:{session},error}=await db.auth.getSession();if(error||!session?.user?.id){location.href="login.html";return;}
 const {data:profile,error:pe}=await db.from("profiles").select("role,account_status").eq("id",session.user.id).maybeSingle();
 const {data:owner,error:oe}=await db.rpc("is_site_owner");
 if(pe||oe||!profile||profile.account_status!=="active"||!(profile.role==="admin"||owner===true)){document.body.innerHTML='<main class="ai-shell"><div class="ai-notice">このページは有効な管理者・オーナー専用です。</div><a href="admin.html">管理画面へ戻る</a></main>';return;}
}
form.addEventListener("submit",async e=>{
 e.preventDefault();if(busy)return;const text=prompt.value.trim();if(!text)return;
 const {data:{session}}=await db.auth.getSession();if(!session?.access_token){status.textContent="ログイン状態が切れました。再ログインしてください。";return;}
 busy=true;send.disabled=true;prompt.disabled=true;status.textContent="AIが回答を生成しています...";
 addMessage(text,"user");prompt.value="";
 try{
  const response=await fetch(WORKER+"/api/admin-chat",{method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+session.access_token},body:JSON.stringify({prompt:text,conversation_id:conversationId})});
  const data=await response.json();if(!response.ok)throw new Error(data.error||"AIへの接続に失敗しました。");
  addMessage(data.text||"回答がありません。","assistant",data.model||"Cloudflare Workers AI");
  status.textContent="会話を監査ログに保存しました。";
 }catch(err){status.textContent=String(err.message||err);status.className="ai-status ai-error";addMessage("エラー: "+String(err.message||err),"assistant");}
 finally{busy=false;send.disabled=false;prompt.disabled=false;prompt.focus();}
});
$("ai-clear").addEventListener("click",()=>{if(busy)return;messages.innerHTML='<div class="ai-empty" id="ai-empty">新しい会話を開始しました。</div>';conversationId=crypto.randomUUID();status.textContent="新しい会話を開始しました。保存済みの監査ログは削除されません。";});
init();
})();
</script>
</body></html>
