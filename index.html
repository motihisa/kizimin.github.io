<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Kizimin - 記事を読んだり、書いたりできる場所。">
  <title>Kizimin</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a class="logo" href="index.html">Kizimin</a>
      <nav class="nav" aria-label="メインメニュー">
        <a href="#latest">新着</a>
        <a href="#popular">人気</a>
        <a href="#categories">カテゴリ</a>
      </nav>
      <div class="header-actions">
        <input id="article-search" class="search" type="search" placeholder="記事を検索" aria-label="記事を検索">
        <a id="notifications-link" class="login" href="notifications.html">通知</a><a id="dm-link" class="login" href="dm.html">DM</a><button id="auth-button" class="login" type="button">ログイン</button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>好きなことを、<br>好きなように書こう。</h1>
      <p>Kiziminは、記事を読んだり、書いたりできる場所です。</p>
    </section>

    <div class="content">
      <section id="latest">
        <h2 class="section-title">新着記事</h2>
        <div id="article-list" class="articles">
          <div class="loading">記事を読み込んでいます…</div>
        </div>
      </section>

      <aside class="sidebar">
        <div class="side-card">
          <h2>記事を書いてみよう</h2>
          <p>あなたの知っていること、考えたこと、好きなことを文章にできます。</p>
          <button id="write-button" class="write-button" type="button">記事を書く</button>
        </div>

        <div class="categories" id="categories">
          <h2>カテゴリ</h2>
          <div class="category-list">
            <a class="category" href="#category-daily">日常</a>
            <a class="category" href="#category-tech">テクノロジー</a>
            <a class="category" href="#category-game">ゲーム</a>
            <a class="category" href="#category-study">勉強</a>
            <a class="category" href="#category-creative">創作</a>
            <a class="category" href="#category-other">その他</a>
          </div>
        </div>

        <div class="categories" id="account-panel">
          <h2>アカウント</h2>
          <p id="account-status" class="text-muted">確認しています…</p>
          <button id="logout-button" class="login hidden" type="button">ログアウト</button>
        </div>
      </aside>
    </div>
  </main>

  <footer>© 2026 Kizimin</footer>

  <script src="js/ban-screen.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/maintenance-gate.js"></script>
  <script src="js/main.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/access.js"></script>
</body>
</html>
