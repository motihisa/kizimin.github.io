<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>記事を書く | Kizimin</title><link rel="stylesheet" href="css/style.css"></head>
<body><main class="container" style="max-width:820px;padding-top:56px;padding-bottom:80px"><a class="logo" href="/">Kizimin</a><div class="card" style="padding:28px;margin-top:28px"><h1>記事を書く</h1><div class="form-group"><label class="form-label">タイトル</label><input id="title" class="form-input"></div><div class="form-group"><label class="form-label">概要</label><input id="excerpt" class="form-input"></div><div class="form-group"><label class="form-label">本文</label><textarea id="content" class="form-textarea" style="min-height:360px"></textarea></div><div class="form-group"><label class="form-label">カテゴリ</label><select id="category" class="form-select"></select></div><button id="draft" class="login">下書き保存</button> <button id="publish" class="write-button" style="width:auto">公開する</button><p id="message" class="text-muted"></p></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient("https://bimddapbkdakspjaemsm.supabase.co","sb_publishable_JSnuaf48KMeQ4sodofBg8A_RGlhFHpf");let uid=null;
function slugify(s){return s.toLowerCase().trim().replace(/[^a-z0-9ぁ-んァ-ン一-龥]+/g,"-").replace(/^-+|-+$/g,"")+"-"+Date.now();}
(async()=>{const {data}=await sb.auth.getSession();if(!data.session){location.href="login.html";return;}uid=data.session.user.id;const {data:c}=await sb.from("categories").select("id,name").order("name");category.innerHTML=(c||[]).map(x=>'<option value="'+x.id+'">'+x.name+'</option>').join("");})();
async function save(status){const title=document.querySelector("#title").value.trim(),content=document.querySelector("#content").value.trim();if(!title||!content){message.textContent="タイトルと本文を入力してください。";return;}const {error}=await sb.from("articles").insert({author_id:uid,category_id:category.value||null,title,slug:slugify(title),excerpt:excerpt.value.trim()||null,content,status,published_at:status==="published"?new Date().toISOString():null});message.textContent=error?error.message:(status==="published"?"公開しました。":"下書きを保存しました。");if(!error&&status==="published")setTimeout(()=>location.href="/",500);}
document.querySelector("#draft").onclick=()=>save("draft");document.querySelector("#publish").onclick=()=>save("published");
</script><script src="js/access.js"></script>
</body></html>
